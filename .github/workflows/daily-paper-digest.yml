name: Daily sparse terrain paper digest

on:
  push:
    branches: [main]
    paths:
      - "reports/prepared/*.json"
      - ".github/workflows/daily-paper-digest.yml"
      - "codex_delivery.py"
      - "submit_codex_report.py"
      - "tests/test_codex_delivery.py"
  schedule:
    # Backup check only; Codex supplies Chinese notes, GitHub never calls an AI API.
    - cron: "7 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate Codex notes without publishing or updating sent history"
        type: boolean
        default: true

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      TZ: Asia/Shanghai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify notes, exclusions and publication safety
        run: python -m unittest discover -s tests -v

      - name: Publish Codex-authored Chinese notes
        env:
          DIGEST_MENTION: "@${{ github.repository_owner }}"
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python codex_delivery.py --dry-run
          else
            python codex_delivery.py
          fi
