name: Daily sparse terrain paper digest

on:
  schedule:
    # 02:00 UTC = 10:00 Asia/Shanghai
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Search and publish digest
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          DIGEST_MENTION: "@${{ github.repository_owner }}"
          GH_TOKEN: ${{ github.token }}
        run: |
          python paper_digest.py \
            --output digest.md \
            --state seen_papers.json \
            --count-output digest_count.txt
          count="$(cat digest_count.txt)"
          if [ "$count" -eq 0 ]; then
            echo "没有发现新的论文，跳过通知。"
            exit 0
          fi
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 20 \
            --json number,title \
            --jq '.[] | select(.title == "[论文日报] 稀疏地形重建文章日报") | .number' \
            | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file digest.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "[论文日报] 稀疏地形重建文章日报" \
              --body-file digest.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_papers.json
          git commit -m "Track sent paper digest entries"
          git push
